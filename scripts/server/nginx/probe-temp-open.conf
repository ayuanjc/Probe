# ============================================================
# 【临时】裸 IP 直连开放（2026-10-25，应 YG 要求「先放开」）
#
# 为什么存在：域名 ayuanjc.online 还没备案，腾讯云在边缘把 80 端口
# 上带该域名的请求 302 到 webblock 页；备案通过前域名基本用不了。
# 这份配置让 http://106.52.116.164/ 直接进应用，方便自测和给朋友看。
#
# ⚠️ 备案开始（提交订单）之前必须删除 / 停用，否则「换 Host 仍可访问
#    站点」是明确的驳回理由。回滚命令：
#      rm /etc/nginx/sites-enabled/probe-temp-open
#      ln -s /etc/nginx/sites-available/probe-closed /etc/nginx/sites-enabled/probe-closed
#      rm /etc/nginx/sites-enabled/probe-root
#      nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location /_next/static/ {
        proxy_pass http://probe_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://probe_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-probe-region "";
        proxy_set_header x-probe-country $geoip2_data_country_code;
        proxy_set_header eo-client-ipcountry "";
        proxy_set_header cf-ipcountry "";
        proxy_set_header x-vercel-ip-country "";
        proxy_set_header x-country-code "";
        proxy_set_header x-geo-country "";
        proxy_set_header x-real-ip-country "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10m;
    }
}
