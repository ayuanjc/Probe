# ============================================================
# 探针 生产站点  ·  备案整改 A 方案（2026-10-25）
# 域名根 = 探针；云影图鉴下线（文件保留在 /opt/yunying，nginx 不再引用）
#
# 前提：探针必须用「不带 basePath」重新构建
#   probe.env 里删掉 PROBE_BASE_PATH / NEXT_PUBLIC_PROBE_BASE_PATH
#   NEXT_PUBLIC_* 是构建期注入，改完必须重新 build，否则资源仍指向 /probe/_next
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name ayuanjc.online www.ayuanjc.online;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # 旧入口兼容：书签里的 /probe/* 永久跳到根
    location = /probe {
        return 301 /;
    }
    location ^~ /probe/ {
        rewrite ^/probe/(.*)$ /$1 permanent;
    }

    # Next 产物是内容哈希命名的，可以永久缓存并让 nginx 自己落盘
    location /_next/static/ {
        proxy_pass http://probe_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_cache probe_static;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    location / {
        proxy_pass http://probe_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 区域判定的国家头只能由本机注入，客户端自带的一律清掉。
        # （实测：访客发一句 x-probe-country: SG 就能给自己开出境通道）
        proxy_set_header x-probe-region "";
        proxy_set_header x-probe-country $geoip2_data_country_code;
        proxy_set_header eo-client-ipcountry "";
        proxy_set_header cf-ipcountry "";
        proxy_set_header x-vercel-ip-country "";
        proxy_set_header x-country-code "";
        proxy_set_header x-geo-country "";
        proxy_set_header x-real-ip-country "";
        proxy_set_header Connection "";

        # SSE：search 的事件必须逐帧下发，攒一坨就退化成一次性响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 反馈附件上限 8MB
        client_max_body_size 10m;

        limit_req zone=probe_rl burst=40 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        limit_conn_log_level info;
        limit_conn probe_conn 12;
        limit_conn_status 429;
    }
}
