# ============================================================
# 裸 IP 入口（2026-10-26 备案整改 C 方案）
#
# 为什么存在：域名还没备案，腾讯云在边缘把带 ayuanjc.online 的请求
# 302 到 webblock 页；这段时间想看站点只能走裸 IP 106.52.116.164。
#
# 与旧 probe-temp-open 的区别（备案要点）：
#   probe-temp-open 是 `server_name _` + default_server —— 任何 Host
#   都能拿到站点，审核员「关掉解析后换 Host 仍可访问」即可驳回。
#   这份只认 IP 字面量；陌生 Host / 伪造 Host 落到 probe-block 的 444。
#
# 依赖 /etc/nginx/conf.d/probe-upstream.conf 里的 probe_rl / probe_conn zone。
# 备案通过后启用 probe-root 时把这份撤掉。
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name 106.52.116.164;

    # 压测发现：旧裸 IP 入口完全没有限流，30 并发 0 个 429。
    limit_req zone=probe_rl burst=40 nodelay;
    limit_req_status 429;
    limit_conn probe_conn 12;
    limit_conn_status 429;

    client_max_body_size 10m;
    proxy_buffering off;
    proxy_read_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_pass http://probe_next;
    }
}