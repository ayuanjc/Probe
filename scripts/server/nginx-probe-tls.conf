# 探针 · HTTPS 站点（备案通过后启用）
#
# 用法（证书签好之后）：
#   cp scripts/server/nginx-probe-tls.conf /etc/nginx/sites-available/probe-root
#   ln -sf /etc/nginx/sites-available/probe-root /etc/nginx/sites-enabled/probe-root
#   rm -f /etc/nginx/sites-enabled/probe-closed     # 阶段 A 的「全 444」必须摘掉
#   nginx -t && systemctl reload nginx
#
# 三条硬要求（都是早期踩过的坑）：
#   1. default_server 必须 return 444 —— 否则任意 Host 都能拿到 200，
#      备案核验会判「域名未解析仍可访问」而驳回。兜底 server 在文件末尾。
#   2. 访客自带的 x-probe-country / cf-ipcountry 一律清空，只用 geoip2 的结果 ——
#      否则任何人塞一个 x-probe-country: SG 就能给自己开出境通道（数据出境）。
#      这几行清头已经在 map 段里，不在本文件；改 nginx.conf 时要一起看。
#   3. proxy_pass 后面不能带 URI（带了会把 location 前缀吃掉）。

server {
    listen 80;
    listen [::]:80;
    server_name ayuanjc.online www.ayuanjc.online;

    # 只把 ACME 校验路径留在 80 上（续期用），其余全部跳 443
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ayuanjc.online www.ayuanjc.online;

    ssl_certificate     /etc/letsencrypt/live/ayuanjc.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayuanjc.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 老的 /probe 前缀链接还有人点，永久跳回根
    location = /probe { return 301 /; }
    location ^~ /probe/ { rewrite ^/probe/(.*)$ /$1 permanent; }

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location /_next/static/ {
        proxy_pass http://probe_next;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://probe_next;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 区域判定只信这一行（访客自带的国家头在上面被清掉）
        proxy_set_header x-probe-country $geoip2_data_country_code;

        # SSE：搜索与核验都是流式，不能缓冲、不能压、超时放宽
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        client_max_body_size 10m;
        limit_req zone=probe_rl burst=40 nodelay;
        limit_conn probe_conn 12;
    }
}

# 兜底：不匹配任何 server_name 的请求直接断开（不是 200，也不是 404）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/ayuanjc.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayuanjc.online/privkey.pem;
    return 444;
}
