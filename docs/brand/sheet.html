<!doctype html><html><head><meta charset="utf-8"><style>
  body { margin:0; background:#000; color:#a3a3a3; font:13px/1.5 'Segoe UI', 'Microsoft YaHei', sans-serif; padding:40px 44px; }
  h1 { font: 200 26px/1 'Segoe UI'; letter-spacing:.3em; color:#fff; margin:0 0 26px; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:26px; }
  figure { margin:0; }
  .box { background:#000; border:1px solid #1f1f1f; display:flex; align-items:center; justify-content:center; padding:10px; height:300px; }
  .box img { max-width:100%; max-height:100%; object-fit:contain; }
  figcaption { margin-top:8px; font-size:12px; color:#737373; font-family:ui-monospace, Consolas, monospace; }
  .sq .box { height:300px; }
</style></head><body>
<h1>PROBE · 品牌资产</h1>
<div class="grid">
<figure><div class="box"><img src="png/avatar-mark.png"></div><figcaption>头像 · 图形 1:1（1080）</figcaption></figure>
<figure><div class="box"><img src="png/avatar-wordmark.png"></div><figcaption>头像 · 图形+PROBE 1:1（1080）</figcaption></figure>
<figure><div class="box"><img src="png/mark-transparent.png"></div><figcaption>水印 · 纯图形（透明）</figcaption></figure>
<figure><div class="box"><img src="png/banner-3x1.png"></div><figcaption>主页横幅 3:1（3000×1000）</figcaption></figure>
<figure><div class="box"><img src="png/banner-2x1.png"></div><figcaption>主页横幅 2:1（2400×1200）</figcaption></figure>
<figure><div class="box"><img src="png/banner-16x9.png"></div><figcaption>横幅 16:9（1920×1080）</figcaption></figure>
<figure><div class="box"><img src="png/banner-4x5.png"></div><figcaption>主页横幅 4:5（1080×1350）</figcaption></figure>
<figure><div class="box"><img src="png/cover-9x16.png"></div><figcaption>视频/直播封面 9:16（1080×1920）</figcaption></figure>
<figure><div class="box"><img src="png/lockup-horizontal.png"></div><figcaption>横向锁标（透明 · 2400×600）</figcaption></figure>
</div></body></html>
